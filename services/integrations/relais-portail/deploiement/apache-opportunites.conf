# =================================================================
#  opportunites.ageroute.gov.gn — hôte virtuel Apache
# =================================================================
#  Variante pour le serveur 102.211.199.132 (Apache 2.4 / Ubuntu),
#  celui qui héberge GLPI. À utiliser si le portail est déployé là
#  plutôt que sur 102.211.199.131, dont le routeur de bord est
#  Traefik.
#
#  PRÉREQUIS
#    sudo a2enmod ssl headers rewrite
#    # proxy et proxy_http seulement le jour où le relais est déployé
#
#  INSTALLATION
#    sudo cp apache-opportunites.conf /etc/apache2/sites-available/opportunites.conf
#    sudo a2ensite opportunites
#    sudo apache2ctl configtest
#    sudo systemctl reload apache2
#    sudo certbot --apache -d opportunites.ageroute.gov.gn
#
#  certbot réécrit lui-même le bloc :443 avec les bons chemins de
#  certificat. Installer d'abord ce fichier, puis lancer certbot.
# =================================================================

<VirtualHost *:80>
    ServerName opportunites.ageroute.gov.gn
    DocumentRoot /var/www/opportunites

    # Le challenge ACME doit être servi en clair, sans redirection :
    # c'est la cause la plus fréquente d'échec d'émission.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    <Directory /var/www/opportunites>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/opportunites.error.log
    CustomLog ${APACHE_LOG_DIR}/opportunites.access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName opportunites.ageroute.gov.gn
    DocumentRoot /var/www/opportunites

    SSLEngine on
    # Renseignés par certbot --apache ; laissés en exemple.
    SSLCertificateFile    /etc/letsencrypt/live/opportunites.ageroute.gov.gn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/opportunites.ageroute.gov.gn/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    # ---------------- En-têtes de sécurité ----------------
    # CSP du mode consultation seule : le site ne charge que ses
    # propres ressources et les polices Google. Ajouter les domaines
    # du CAPTCHA le jour où le dépôt de candidature est ouvert.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()"

    <Directory /var/www/opportunites>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    # Données régénérées toutes les 15 minutes : jamais mises en cache.
    <LocationMatch "^/data/">
        Header always set Cache-Control "no-store"
    </LocationMatch>

    # config.js porte les points d'entrée : relu à chaque déploiement.
    <Files "config.js">
        Header always set Cache-Control "no-cache"
    </Files>

    <LocationMatch "^/(assets|documents)/">
        Header always set Cache-Control "public, max-age=3600"
    </LocationMatch>

    # ---------------- Relais de candidature ----------------
    #  À décommenter le jour où le flux WF-05 est en service et où le
    #  relais tourne sur le port 8080 de cette machine. Tant qu'il est
    #  commenté, le portail reste en consultation seule et le site
    #  masque de lui-même le bouton « Postuler ».
    #
    #  Nécessite : sudo a2enmod proxy proxy_http
    #
    # LimitRequestBody 50000000
    # ProxyPreserveHost On
    # ProxyPass        /api/ http://127.0.0.1:8080/api/
    # ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    # RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/opportunites.error.log
    CustomLog ${APACHE_LOG_DIR}/opportunites.access.log combined
</VirtualHost>
