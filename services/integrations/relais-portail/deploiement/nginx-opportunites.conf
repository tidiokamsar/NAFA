# =================================================================
#  opportunites.ageroute.gov.gn — configuration Nginx de référence
# =================================================================
#  Le front public et le relais sont servis sous la MÊME origine :
#  le navigateur n'a donc aucune requête inter-origine à faire, et
#  aucune configuration CORS n'est nécessaire (ORIGINES_AUTORISEES
#  reste vide côté relais).
#
#  Adapter : chemins des certificats, racine du site, adresse du
#  relais si celui-ci tourne ailleurs que sur la machine.
# =================================================================

# Limitation de débit de premier rideau. Le relais applique ses
# propres quotas par usage ; celle-ci protège le serveur lui-même.
limit_req_zone $binary_remote_addr zone=api_portail:10m rate=30r/m;

upstream relais_portail {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name opportunites.ageroute.gov.gn;
    # Seul le renouvellement ACME reste en clair.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opportunites.ageroute.gov.gn;

    ssl_certificate     /etc/ssl/ageroute/opportunites.crt;
    ssl_certificate_key /etc/ssl/ageroute/opportunites.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/opportunites;
    index index.html;
    charset utf-8;

    # ---------------- En-têtes de sécurité ----------------
    # La CSP autorise le widget CAPTCHA et les polices Google.
    # Retirer les domaines inutilisés une fois le fournisseur choisi ;
    # ajouter celui de Matomo dans script-src et connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.google.com https://www.gstatic.com https://js.hcaptcha.com; frame-src https://challenges.cloudflare.com https://www.google.com https://newassets.hcaptcha.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Un dépôt de candidature peut peser jusqu'à 30 Mo de pièces,
    # soit environ 41 Mo une fois encodées en base64.
    client_max_body_size 48m;
    client_body_timeout 120s;

    # ---------------- Relais (candidatures, abonnements) ----------------
    location /api/ {
        limit_req zone=api_portail burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://relais_portail;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Indispensable au comptage par adresse du relais, qui doit
        # alors tourner avec PROXY_DE_CONFIANCE=true.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }

    # ---------------- Données publiées ----------------
    # Régénérées toutes les 15 minutes : jamais mises en cache long.
    location /data/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # ---------------- Documents publics (DAO, TDR, attributions) --------
    location /documents/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---------------- Ressources statiques ----------------
    location /assets/ {
        # config.js porte les points d'entrée : il doit être relu à
        # chaque déploiement, contrairement au CSS et au JS.
        location = /assets/config.js {
            add_header Cache-Control "no-cache" always;
        }
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # La sonde du relais ne doit pas être exposée au public.
    location = /api/sante {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://relais_portail;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/opportunites.access.log;
    error_log  /var/log/nginx/opportunites.error.log warn;
}
