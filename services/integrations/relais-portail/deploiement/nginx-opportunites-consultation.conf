# =================================================================
#  opportunites.ageroute.gov.gn — hôte virtuel « consultation seule »
# =================================================================
#  Variante à utiliser AVANT la mise en service du relais et des flux
#  Power Automate. Elle ne comporte ni bloc `upstream` ni `location
#  /api/` : nginx démarre donc sans qu'aucun service n'écoute sur le
#  port 8080.
#
#  Le portail affiche les avis et sert les documents ; le bouton
#  « Postuler » et le bloc d'abonnement sont masqués par la
#  configuration du site (points d'entrée laissés vides par
#  06-preparer-publication.ps1).
#
#  Basculer sur nginx-opportunites.conf le jour où le relais est
#  déployé.
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name opportunites.ageroute.gov.gn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opportunites.ageroute.gov.gn;

    ssl_certificate     /etc/letsencrypt/live/opportunites.ageroute.gov.gn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opportunites.ageroute.gov.gn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/opportunites;
    index index.html;
    charset utf-8;

    # `connect-src 'self'` suffit en consultation : le site ne fait
    # qu'une requête, vers son propre fichier de données.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Régénérées toutes les 15 minutes : jamais mises en cache long.
    location /data/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /documents/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        location = /assets/config.js {
            add_header Cache-Control "no-cache" always;
        }
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Le dépôt de candidature n'est pas encore ouvert : répondre
    # franchement plutôt que de laisser une requête pendre.
    location /api/ {
        return 503;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/opportunites.access.log;
    error_log  /var/log/nginx/opportunites.error.log warn;
}
