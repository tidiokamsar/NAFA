name: CI

on:
  # Deliberately no `feature/**` here. A feature branch with an open pull
  # request was matched by both triggers and ran the whole suite twice; the
  # `pull_request` event already covers every branch on its way to main.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # The two events name the same branch differently: a push reports
  # refs/heads/feature/x while its own pull request reports refs/pull/N/merge.
  # Keying on `github.ref` therefore built two distinct groups that could never
  # cancel each other. Both expressions below resolve to the source branch name.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  # `prisma generate` resolves DATABASE_URL but never connects, so jobs that
  # only build/lint can use a placeholder.
  DATABASE_URL: postgresql://nafa:nafa_dev_password@localhost:5432/nafa_dev
  REDIS_URL: redis://localhost:6379
  # Length matters: platform env validation requires >= 32 characters.
  JWT_SECRET: ci-secret-not-used-for-anything-real-but-long-enough
  JWT_EXPIRES_IN: 1h
  OTEL_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  # NODE_ENV is intentionally unset — see .env.example.

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  lint-build-test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache the Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm exec nx run-many -t lint

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck

      - name: Build
        run: pnpm exec nx run-many -t build

      - name: Unit tests
        run: pnpm exec nx run-many -t test

  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    env:
      # Every project that owns a `test:e2e` target. Declared once and reused by
      # both steps below, so a new service is one edit rather than two.
      E2E_PROJECTS: "@nafa/iam,@nafa/geography-service,@nafa/products-service,@nafa/trade-service,@nafa/actor-service"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nafa
          POSTGRES_PASSWORD: nafa_dev_password
          POSTGRES_DB: nafa_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nafa -d nafa_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache the Nx computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the suites under test and their workspace dependencies
        # The `build` target declares dependsOn ["^build", @nafa/database:db:generate],
        # so this one command generates the Prisma client and puts every workspace
        # package these suites import into dist/. It replaces a hand-listed
        # "build @nafa/platform" step that covered IAM and nothing else.
        run: pnpm exec nx run-many -t build -p "$E2E_PROJECTS"

      - name: Apply migrations
        run: pnpm --filter @nafa/iam run db:deploy

      - name: Seed the bootstrap admin account
        run: pnpm --filter @nafa/iam run db:seed

      - name: End-to-end tests against real Postgres and Redis
        # Only IAM's suite ran here before. The other four were unreachable from
        # CI: the default `test` target pins Jest's rootDir to src/, so
        # `nx run-many -t test` never sees test/*.e2e-spec.ts, and nothing
        # invoked the `test:e2e` target that owns them. Five of the six e2e
        # suites in this repository had never run outside a developer's machine.
        #
        # --parallel=1 is a correctness requirement, not tuning: every suite
        # provisions, pushes the schema to, and truncates the same nafa_test
        # database, so two running at once would clobber each other.
        run: pnpm exec nx run-many -t test:e2e -p "$E2E_PROJECTS" --parallel=1

  infra-manifests:
    name: Helm chart, Kubernetes manifests, Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint infrastructure/helm/nafa-service

      - name: helm template (default values)
        run: helm template test infrastructure/helm/nafa-service > /dev/null

      - name: helm template (iam values)
        run: |
          helm template iam infrastructure/helm/nafa-service \
            -f infrastructure/helm/nafa-service/values-iam.yaml > /dev/null

      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f infrastructure/kubernetes/

      - name: Validate docker compose file
        run: docker compose -f infrastructure/docker/docker-compose.dev.yml config > /dev/null

  docker-images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build IAM service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/iam/Dockerfile
          target: runtime
          push: false
          tags: nafa/iam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Admin Portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/admin-portal/Dockerfile
          target: runtime
          push: false
          tags: nafa/admin-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AR-0002 blockers 1-3: an infrastructure only exists once it starts.
  # This job runs the full stack for real and asserts the endpoints answer.
  stack-smoke:
    name: Stack smoke test (docker compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f infrastructure/docker/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4

      - name: Start the whole stack
        # --wait blocks until every healthcheck passes and every one-shot
        # container (iam-migrate, minio-init) has exited successfully.
        run: $COMPOSE up -d --build --wait

      - name: Show container status
        run: $COMPOSE ps

      - name: prisma migrate deploy (idempotent re-run)
        run: $COMPOSE run --rm iam-migrate

      - name: prisma db seed
        run: |
          $COMPOSE run --rm --entrypoint sh iam-migrate -c \
            "pnpm exec prisma db seed"

      - name: GET /live
        run: curl --fail --show-error --silent -i http://localhost:3000/live

      - name: GET /ready
        run: curl --fail --show-error --silent -i http://localhost:3000/ready

      - name: GET /health
        run: curl --fail --show-error --silent -i http://localhost:3000/health

      - name: GET /metrics (Prometheus exporter)
        run: |
          curl --fail --show-error --silent http://localhost:9464/metrics | head -n 25

      - name: GET /api/docs (Swagger)
        run: curl --fail --show-error --silent -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/docs

      - name: Admin portal responds
        run: curl --fail --show-error --silent -i http://localhost:3100/api/health

      - name: Auth round-trip against the real stack
        run: |
          set -euo pipefail
          EMAIL="smoke-$(date +%s)@nafa.gn"
          echo "Registering $EMAIL"
          curl --fail --show-error --silent -X POST http://localhost:3000/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\"}" | tee /tmp/register.json
          echo
          curl --fail --show-error --silent -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\"}" | tee /tmp/login.json
          echo
          grep -q accessToken /tmp/login.json

      - name: Error contract is standardized
        run: |
          set -euo pipefail
          # Deliberately invalid payload: must come back in the shared shape.
          curl --silent -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","password":"x"}' | tee /tmp/error.json
          echo
          grep -q '"statusCode"' /tmp/error.json
          grep -q '"requestId"' /tmp/error.json

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
