name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `prisma generate` resolves DATABASE_URL but never connects, so jobs that
  # only build/lint can use a placeholder.
  DATABASE_URL: postgresql://nafa:nafa_dev_password@localhost:5432/nafa_dev
  REDIS_URL: redis://localhost:6379
  # Length matters: platform env validation requires >= 32 characters.
  JWT_SECRET: ci-secret-not-used-for-anything-real-but-long-enough
  JWT_EXPIRES_IN: 1h
  OTEL_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  # NODE_ENV is intentionally unset — see .env.example.

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  lint-build-test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm exec nx run-many -t lint

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck

      - name: Build
        run: pnpm exec nx run-many -t build

      - name: Unit tests
        run: pnpm exec nx run-many -t test

  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nafa
          POSTGRES_PASSWORD: nafa_dev_password
          POSTGRES_DB: nafa_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nafa -d nafa_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nafa/database run db:generate

      - name: Build @nafa/platform (iam imports it from dist)
        run: pnpm --filter @nafa/platform run build

      - name: Apply migrations
        run: pnpm --filter @nafa/iam run db:deploy

      - name: Seed the bootstrap admin account
        run: pnpm --filter @nafa/iam run db:seed

      - name: End-to-end tests against real Postgres and Redis
        run: pnpm --filter @nafa/iam run test:e2e

  infra-manifests:
    name: Helm chart, Kubernetes manifests, Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint infrastructure/helm/nafa-service

      - name: helm template (default values)
        run: helm template test infrastructure/helm/nafa-service > /dev/null

      - name: helm template (iam values)
        run: |
          helm template iam infrastructure/helm/nafa-service \
            -f infrastructure/helm/nafa-service/values-iam.yaml > /dev/null

      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f infrastructure/kubernetes/

      - name: Validate docker compose file
        run: docker compose -f infrastructure/docker/docker-compose.dev.yml config > /dev/null

  docker-images:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build IAM service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/iam/Dockerfile
          target: runtime
          push: false
          tags: nafa/iam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Admin Portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/admin-portal/Dockerfile
          target: runtime
          push: false
          tags: nafa/admin-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AR-0002 blockers 1-3: an infrastructure only exists once it starts.
  # This job runs the full stack for real and asserts the endpoints answer.
  stack-smoke:
    name: Stack smoke test (docker compose up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f infrastructure/docker/docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4

      - name: Start the whole stack
        # --wait blocks until every healthcheck passes and every one-shot
        # container (iam-migrate, minio-init) has exited successfully.
        run: $COMPOSE up -d --build --wait

      - name: Show container status
        run: $COMPOSE ps

      - name: prisma migrate deploy (idempotent re-run)
        run: $COMPOSE run --rm iam-migrate

      - name: prisma db seed
        run: |
          $COMPOSE run --rm --entrypoint sh iam-migrate -c \
            "pnpm exec prisma db seed"

      - name: GET /live
        run: curl --fail --show-error --silent -i http://localhost:3000/live

      - name: GET /ready
        run: curl --fail --show-error --silent -i http://localhost:3000/ready

      - name: GET /health
        run: curl --fail --show-error --silent -i http://localhost:3000/health

      - name: GET /metrics (Prometheus exporter)
        run: |
          curl --fail --show-error --silent http://localhost:9464/metrics | head -n 25

      - name: GET /api/docs (Swagger)
        run: curl --fail --show-error --silent -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/docs

      - name: Admin portal responds
        run: curl --fail --show-error --silent -i http://localhost:3100/api/health

      - name: Auth round-trip against the real stack
        run: |
          set -euo pipefail
          EMAIL="smoke-$(date +%s)@nafa.gn"
          echo "Registering $EMAIL"
          curl --fail --show-error --silent -X POST http://localhost:3000/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\"}" | tee /tmp/register.json
          echo
          curl --fail --show-error --silent -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"password123\"}" | tee /tmp/login.json
          echo
          grep -q accessToken /tmp/login.json

      - name: Error contract is standardized
        run: |
          set -euo pipefail
          # Deliberately invalid payload: must come back in the shared shape.
          curl --silent -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"not-an-email","password":"x"}' | tee /tmp/error.json
          echo
          grep -q '"statusCode"' /tmp/error.json
          grep -q '"requestId"' /tmp/error.json

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
